  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="map-view.css">

</head>
<body class="MapView">
  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <div class="sidebar-nav">
      <a class="nav-item" href="/index.html">
        <span class="material-symbols-outlined nav-icon">home</span>
        <span class="nav-text">Home</span>
      </a>
      <a class="nav-item" href="/catalogue.html">
        <span class="material-symbols-outlined nav-icon">inventory_2</span>
        <span class="nav-text">Catalogue</span>
      </a>
      <a class="nav-item" href="/admin-dashboard.html">
        <span class="material-symbols-outlined nav-icon">edit</span>

      </a>
      <a class="nav-item active" href="/map-view.html">

    </div>
    <div class="sidebar-footer">
    </div>
  </div>

  <div class="top-bar">

        <div class="sidebar-header">
          <h1>Shed Storage</h1>
      </div>
    <div class="bar-left">
      <h2 class="title">Shed Map</h2>
    </div>
  </div>

            <div class="top-rect selected" id="A">A</div>

            <div class="walkway-top"></div>
            <div class="top-rect" id="H">H</div>
          </div>
          <div class="low-shelves">
            <div class="top-rect small-bookshelf" id="I">I</div>
            <div class="alignment1"></div>
            <div class="top-rect big-bookshelf" id="J">J</div>
            <div class="alignment2"></div>
          </div>
        </div>
      </div>
      <div class="section">
        <h2 class="shelf-title">Shelf A</h2>
        <div class="shelf-view"></div>
