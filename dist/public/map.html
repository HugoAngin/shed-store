<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Storage Area Map</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="map.css">

</head>
<body class="Map">
  <h1>Storage Area Map</h1>
  <div class="container">
    <div class="section">
      <h2>Top View</h2>
      <div class="top-view">
        <div class="main-shelves">
          <div class="top-rect" id="A">A</div>
          <div class="walkway-top"></div>
          <div class="top-rect" id="B">B</div>
          <div class="top-rect" id="C">C</div>
          <div class="walkway-top"></div>
          <div class="top-rect" id="D">D</div>
          <div class="top-rect" id="E">E</div>
          <div class="walkway-top"></div>
          <div class="top-rect" id="F">F</div>
          <div class="top-rect" id="G">G</div>
          <div class="walkway-top"></div>
          <div class="top-rect" id="H">H</div>
        </div>
        <div class="low-shelves">
          <div class="top-rect small-bookshelf" id="I">I</div>
          <div class="alignment1"></div>
          <div class="top-rect big-bookshelf" id="J">J</div>
          <div class="alignment2"></div>
        </div>
      </div>
    </div>
    <div class="section">
      <h2 class="shelf-title">Shelf A</h2>
      <div class="shelf-view">
      </div>
    </div>
  </div>
  <script defer src="bundle.js"></script>
</body>
</html>
